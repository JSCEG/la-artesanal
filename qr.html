<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Artesanal | Contacto rapido</title>
    <link rel="icon" type="image/png" href="./assets/logo-artesanal.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="qr-body">
    <main class="qr-shell">
        <div class="qr-card">
            <img src="./assets/logo-artesanal.png" alt="Logo La Artesanal" class="qr-logo">
            <p class="eyebrow">Bienvenido</p>
            <h1>La Artesanal</h1>
            <p class="qr-copy">Escaneaste el acceso rapido de la marca. Desde aqui puedes contactar, ver el catalogo y hacer pedido.</p>

            <div class="qr-contact">
                <p><strong>Telefono:</strong> <span data-phone></span></p>
                <p><strong>Correo:</strong> <span data-email></span></p>
                <p><strong>Direccion:</strong> <span data-address></span></p>
            </div>

            <div class="qr-actions">
                <a class="cta" href="./index.html#pedidos">Hacer pedido</a>
                <a class="cta secondary" href="./index.html#catalogo">Ver catalogo</a>
                <a class="cta tertiary" href="./index.html#contacto">Contactar</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { APP_CONFIG } from "./js/config.js";

        document.querySelector("[data-phone]").textContent = APP_CONFIG.contact.phone;
        document.querySelector("[data-email]").textContent = APP_CONFIG.contact.email;
        document.querySelector("[data-address]").textContent = APP_CONFIG.contact.address;
    </script>
</body>
</html>
